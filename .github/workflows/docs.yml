name: Documentation (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['doc/**', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['doc/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: doc/package-lock.json
      - name: Read Pages settings
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Resolve public documentation URL
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os
          base = os.environ['PAGES_BASE_PATH']
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              repo = os.environ['GITHUB_REPOSITORY'].split('/', 1)[1]
              base = '' if repo.lower().endswith('.github.io') else repo
          base = '/' + base.strip('/') + '/' if base.strip('/') else '/'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DOCS_BASE={base}\nDOCS_DEPLOYMENT=pages\n')
          PY
      - run: npm --prefix doc ci --no-audit --no-fund
      - run: npm --prefix doc run build
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: doc/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5.0.1
