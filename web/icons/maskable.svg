<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed variant for maskable / Apple touch icons: the OS crops the
       corners, so no rounded tile and the mark stays inside the 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16182a"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#8b93ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#b18cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b18cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4b9ff"/>
      <stop offset="1" stop-color="#c9b0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(5.2) translate(-32 -32.25)" fill="url(#mark)">
    <rect x="8" y="10" width="48" height="13" rx="6.5"/>
    <rect x="24" y="27.5" width="16" height="12" rx="4.5" fill-opacity="0.72"/>
    <rect x="26.5" y="43.5" width="11" height="11" rx="4" fill-opacity="0.45"/>
    <circle cx="47.5" cy="16.5" r="2.4" fill="#34d399"/>
  </g>
</svg>
