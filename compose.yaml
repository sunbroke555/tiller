services:
  tiller:
    image: ghcr.io/sunbroke555/tiller:latest
    restart: unless-stopped
    ports:
      # Same-host HTTPS reverse proxy connects here.
      - "127.0.0.1:8080:8080"
    environment:
      # Optional initial connection; all connections can be added in the UI.
      PVE_URL: ${PVE_URL:-}
      PVE_TLS_FINGERPRINT: ${PVE_TLS_FINGERPRINT:-}
      LISTEN: :8080
      PVE_NAME: ${PVE_NAME:-默认 PVE}
      TILLER_INSTANCES_FILE: /data/tiller-instances.json
      TILLER_AUTH_FILE: /data/tiller-auth.json
      # Set this to the actual reverse proxy address/network when applicable.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - tiller-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tiller-data:
